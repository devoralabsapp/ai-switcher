name: Feature request
description: Propose an improvement to the account-switching workflow.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user flow and any alternatives you have tried.
    validations:
      required: true
