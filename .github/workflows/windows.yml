name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft preview release to receive verified Windows assets
        type: string
        default: ''
      daemon_probe:
        description: Attempt the ordinary-user daemon probe (hosted runner may block Task Scheduler)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runtime: [win-x64, win-arm64]
    defaults:
      run:
        working-directory: Windows
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: Windows/global.json
          dotnet-version: '10.0.x'
      - name: Verify shared themes and translations
        run: |
          python ../scripts/sync-windows-assets.py
          git diff --exit-code -- AISwitcher.Core/Assets AISwitcher.Windows/AppIcon.ico
          if($LASTEXITCODE -ne 0){throw 'Shared Windows resources are out of date'}
      - name: Test portable core and real RPC subprocess fixtures
        run: |
          dotnet run --project AISwitcher.Tests/AISwitcher.Tests.csproj -c Release
          if($LASTEXITCODE -ne 0){throw 'Core tests failed'}
      - name: Build standalone Windows app
        id: publish
        run: ../scripts/build-windows.ps1 -Runtime '${{ matrix.runtime }}'
      - name: Exercise native Windows UI and owned process lifecycle
        if: matrix.runtime == 'win-x64'
        run: |
          $root=Join-Path $env:TEMP ('ai-switcher-smoke.'+[Guid]::NewGuid().ToString('N'))
          $output=Join-Path $PWD 'artifacts/previews'
          $app=Join-Path $PWD 'artifacts/win-x64/AISwitcher.exe'
          $p=Start-Process $app -ArgumentList @('--data-dir',"`"$root`"",'--output',"`"$output`"",'--ui-smoke-test') -PassThru
          if(-not $p.WaitForExit(180000)){$p.Kill();throw 'UI smoke timed out'}
          if($p.ExitCode -ne 0){Get-Content (Join-Path $output 'ui-smoke-error.txt');throw 'UI smoke failed'}
          Get-Content (Join-Path $output 'ui-smoke-result.txt')
          Remove-Item -Recurse -Force $root
      - name: Verify standalone EXE with real native Codex RPC (signed out)
        if: ${{ !cancelled() && matrix.runtime == 'win-x64' && steps.publish.outcome == 'success' }}
        run: |
          $tools=Join-Path $env:TEMP ('ai-switcher-codex.'+[Guid]::NewGuid().ToString('N'))
          npm install --prefix $tools --no-audit --no-fund '@openai/codex@0.164.0'
          if($LASTEXITCODE -ne 0){throw 'Official Codex fixture tool install failed'}
          $cli=Get-ChildItem $tools -Recurse -Filter codex.exe | Where-Object {$_.FullName -match 'x86_64-pc-windows-msvc'} | Select-Object -First 1
          if(-not $cli){throw 'Native Windows Codex executable was not found'}
          $output=Join-Path $PWD 'artifacts/previews'
          $app=Join-Path $PWD 'artifacts/AI-Switcher-Windows-win-x64.exe'
          $root=Join-Path $env:TEMP ('ai-switcher-smoke.'+[Guid]::NewGuid().ToString('N'))
          $p=Start-Process $app -ArgumentList @('--data-dir',"`"$root`"",'--output',"`"$output`"",'--stdio-smoke-test','--codex-executable',"`"$($cli.FullName)`"") -PassThru
          if(-not $p.WaitForExit(90000)){$p.Kill();throw 'Native Codex RPC smoke timed out'}
          if($p.ExitCode -ne 0){Get-Content (Join-Path $output 'backend-smoke-error.txt');throw 'Native Codex RPC smoke failed'}
          Get-Content (Join-Path $output 'backend-smoke-result.txt')
          Remove-Item -Recurse -Force $root
          if('${{ inputs.daemon_probe }}' -eq 'true'){../scripts/test-windows-backend.ps1 -App $app -Tools $tools -Output $output}
          Remove-Item -Recurse -Force $tools
      - name: Exercise real official ChatGPT Store runtime with two private windows
        if: matrix.runtime == 'win-x64'
        run: |
          $output=Join-Path $PWD 'artifacts/previews'
          $app=Join-Path $PWD 'artifacts/AI-Switcher-Windows-win-x64.exe'
          ../scripts/test-windows-store-runtime.ps1 -App $app -Output $output
      - name: Save Windows builds and visual QA
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AI-Switcher-Windows-${{ matrix.runtime }}-${{ github.sha }}
          path: |
            Windows/artifacts/*.exe
            Windows/artifacts/*.zip
            Windows/artifacts/*.sha256
          if-no-files-found: warn
          retention-days: 14
      - name: Save Windows preview images and runtime results
        if: always() && matrix.runtime == 'win-x64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Previews-${{ github.sha }}
          path: Windows/artifacts/previews/
          if-no-files-found: warn
          retention-days: 14
  release-assets:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Attach verified standalone EXEs, ZIPs and checksums to draft
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$'){throw 'Expected an explicit preview release tag'}
          $draft=gh release view $env:RELEASE_TAG --json isDraft | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or -not $draft.isDraft){throw 'Release must already exist and remain a draft'}
          gh run download $env:GITHUB_RUN_ID -p "AI-Switcher-Windows-*-$env:GITHUB_SHA" -D release-files
          if($LASTEXITCODE -ne 0){throw 'Could not download verified packages'}
          $checksums=@(Get-ChildItem release-files -Recurse -Filter '*.sha256')
          if($checksums.Count -ne 4){throw 'Expected checksums for two EXEs and two ZIPs'}
          foreach($file in $checksums){
            $parts=(Get-Content $file.FullName).Trim() -split '\s+',2
            $payload=Join-Path $file.DirectoryName $parts[1]
            if((Get-FileHash $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne $parts[0]){throw 'Package checksum mismatch'}
          }
          $paths=@(Get-ChildItem release-files -Recurse -File | ForEach-Object {$_.FullName})
          if($paths.Count -ne 8){throw 'Expected exactly eight Windows release files'}
          gh release edit $env:RELEASE_TAG --target $env:GITHUB_SHA
          if($LASTEXITCODE -ne 0){throw 'Could not select the verified source revision'}
          gh release upload $env:RELEASE_TAG @paths --clobber
          if($LASTEXITCODE -ne 0){throw 'Could not attach Windows release assets'}
